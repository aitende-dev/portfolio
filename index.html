<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture Portfolio</title>
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <div class="site-wrapper">
    <aside class="sidebar">
      <div class="logo">
        <a href="index.html">
          Studio<br>aitende
        </a>
      </div>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">work</a></li>
          <li><a href="info.html">info</a></li>
          <li><a href="contact.html">contact</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">

      <div class="filter-menu" id="filter-menu" style="align-items: center; flex-wrap: wrap;">
        <a href="#" data-filter="featured" class="active"><i class="fa-solid fa-star"></i><span class="filter-text">featured</span></a>
        <a href="#" data-filter="university"><i class="fa-solid fa-building-columns"></i><span class="filter-text">university</span></a>
        <a href="#" data-filter="work"><i class="fa-solid fa-briefcase"></i><span class="filter-text">work</span></a>
        <a href="#" data-filter="personal"><i class="fa-solid fa-asterisk"></i><span class="filter-text">personal</span></a>
        <a href="#" data-filter="all"><i class="fa-solid fa-layer-group"></i><span class="filter-text">all projects</span></a>
      </div>

      <div class="project-grid" id="project-grid">
        <!-- Projects will be loaded dynamically here -->
      </div>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const projectGrid = document.getElementById('project-grid');
      const filterLinks = document.querySelectorAll('.filter-menu a');
      let projects = []; // Will hold the DOM elements after they are created

      // Fetch projects data
      try {
        // Fetch projects data with a timestamp to prevent browser caching
        const response = await fetch('projects.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('Failed to load projects');
        const data = await response.json();

        // Render projects
        data.forEach(project => {
          const card = document.createElement('a');
          card.href = `project.html?id=${project.id}`;
          card.className = 'project-card';
          card.setAttribute('data-category', project.category);

          const img = document.createElement('img');
          img.src = project.thumbnail;
          img.alt = project.shortTitle || project.title;
          if (project.thumbnailPosition) {
            img.style.objectPosition = project.thumbnailPosition;
          }

          const overlay = document.createElement('div');
          overlay.className = 'overlay';

          const title = document.createElement('p');
          title.className = 'project-name';
          title.textContent = project.shortTitle || project.title;

          overlay.appendChild(title);

          card.appendChild(img);
          card.appendChild(overlay);
          projectGrid.appendChild(card);
        });

        // Re-query the projects now that they are in the DOM
        projects = document.querySelectorAll('.project-card');

        // Apply initial filter based on active tab
        const activeTab = document.querySelector('.filter-menu a.active');
        if (activeTab) {
          const filterValue = activeTab.getAttribute('data-filter');
          projects.forEach(project => {
            const projectCategory = project.getAttribute('data-category');
            const categories = projectCategory ? projectCategory.split(' ') : [];
            if (filterValue === 'all' || categories.includes(filterValue)) {
              project.classList.remove('hidden');
            } else {
              project.classList.add('hidden');
            }
          });
        }
      } catch (error) {
        console.error(error);
        projectGrid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1;">Error loading projects.</p>';
      }

      filterLinks.forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault(); // Prevents the page from jumping to the top

          // 1. Remove 'active' class from all links, add to the clicked one
          filterLinks.forEach(l => l.classList.remove('active'));
          link.classList.add('active');

          // 2. Get the category we want to filter by
          const filterValue = link.getAttribute('data-filter');

          // 3. Loop through all projects and hide/show them
          projects.forEach(project => {
            const projectCategory = project.getAttribute('data-category');
            const categories = projectCategory ? projectCategory.split(' ') : [];

            if (filterValue === 'all' || categories.includes(filterValue)) {
              project.classList.remove('hidden'); // Show it
            } else {
              project.classList.add('hidden'); // Hide it
            }
          });
        });
      });
    });
  </script>

</body>

</html>
